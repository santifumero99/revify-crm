services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: revify
      POSTGRES_USER: revify
      POSTGRES_PASSWORD: revify-local
    volumes:
      - revify_pg:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://revify:revify-local@db:5432/revify
      SECRET_KEY: local-development-secret-change-me-123456789
      REVIFY_USER_EMAIL: demo@revify.local
      REVIFY_USER_PASSWORD: demo
      SEED_DEMO_LEAD: "true"
volumes:
  revify_pg:
